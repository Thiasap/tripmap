<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>旅行地图</title>
  <link rel="stylesheet" href="/vendor/quill/quill.snow.css">
  <link rel="stylesheet" href="/vendor/glightbox/css/glightbox.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>旅行地图</h1>
    </div>
    <div class="topbar-actions">
      <label class="scale-control">卡片缩放
        <input id="cardScaleRange" type="range" min="10" max="100" value="100">
        <span id="cardScaleValue">100%</span>
      </label>
      <button id="resetGuestBtn" class="secondary hidden">重置</button>
      <button id="exportBtn" class="secondary">导出</button>
      <button id="settingsBtn" class="secondary">设置</button>
      <button id="addTripBtn" class="primary">添加</button>
    </div>
  </header>

  <main class="workspace">
    <section id="mapWrap" class="map-wrap">
      <svg id="mapSvg"></svg>
      <svg id="linkSvg"></svg>
      <div id="cardsLayer" class="cards-layer"></div>
      <div class="map-hint">滚轮缩放，拖动地图平移；卡片可单独拖动。</div>
    </section>
  </main>

  <div id="tripDialog" class="trip-overlay hidden">
    <div class="trip-dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
      <form id="tripForm" class="trip-dialog-scroll">
        <div class="dialog-head">
          <h2 id="dialogTitle">添加旅行</h2>
          <div class="dialog-actions">
            <button type="button" id="editBtn" class="secondary hidden">编辑</button>
            <button type="button" id="deleteBtn" class="danger hidden">删除</button>
            <button type="submit" id="saveBtn" class="primary">保存</button>
            <button type="button" id="closeBtn" class="secondary">关闭</button>
          </div>
        </div>

        <input type="hidden" name="id" id="tripId">
        <datalist id="provinceOptions"></datalist>
        <datalist id="cityOptions"></datalist>
        <div class="form-grid">
          <label>名称<input name="name" required></label>
          <label>省份<input name="province" list="provinceOptions" placeholder="可选择或手动输入"></label>
          <label>城市<input name="city" list="cityOptions" placeholder="可选择或手动输入"></label>
          <label>详细地址<input name="address_detail"></label>
          <label class="wide-row">
            经纬度
            <span class="coord-inline">
              <input name="coord_raw" placeholder="例：39.9, 116.4" style="flex:3">
              <button type="button" id="autoDetectCoordBtn" class="secondary">自动识别</button>
              <input name="latitude" type="number" step="any" placeholder="纬度" required style="flex:1.2">
              <input name="longitude" type="number" step="any" placeholder="经度" required style="flex:1.2">
              <button type="button" id="pickCoordinateBtn" class="secondary">地图取点</button>
            </span>
          </label>
          <label class="wide">日期
            <span class="date-inline">
              <input name="start_date" type="date" id="startDate">
              <span>—</span>
              <input name="end_date" type="date" id="endDate">
            </span>
          </label>
          <label class="wide-row">人员
            <div class="tag-selector" id="participantTagSelector">
              <div class="tag-selector-container" tabindex="0">
                <span class="tag-list"></span>
                <input class="tag-input" type="text" placeholder="搜索或输入人员姓名" autocomplete="off">
              </div>
              <ul class="tag-dropdown hidden"></ul>
            </div>
            <input type="hidden" name="participants">
          </label>
        </div>

        <section class="editor-section">
          <div class="section-title">
            <span>故事</span>
          </div>
          <div id="richEditor" class="rich-editor"></div>
        </section>

        <div class="media-editor">
          <div class="media-row-title">封面</div>
          <label class="cover-picker">
            <input name="cover" type="file" accept="image/*">
            <span id="coverPreviewText">点击上传或更换图片</span>
            <img id="coverPreview" alt="封面预览">
          </label>
        </div>

        <section id="filesPanel" class="files-panel hidden"></section>
      </form>
      <input type="file" id="hiddenAlbumInput" accept="image/*" multiple hidden>
      <input type="file" id="hiddenAttachmentInput" multiple hidden>
    </div>
  </div>
  <div id="exportDialog" class="trip-overlay hidden">
    <div class="export-card">
      <h2>导出地图</h2>
      <div class="export-options">
        <label>像素密度 <select id="exportScale">
          <option value="1">1x（屏幕分辨率）</option>
          <option value="2" selected>2x（推荐，文字清晰）</option>
          <option value="3">3x（高清）</option>
          <option value="4">4x（超高清）</option>
        </select></label>
        <label>格式 <select id="exportFormat">
          <option value="png" selected>PNG</option>
          <option value="jpeg">JPEG</option>
        </select></label>
      </div>
      <div class="export-actions">
        <button id="exportDoBtn" class="primary">导出</button>
        <button id="exportCancelBtn" class="secondary">取消</button>
      </div>
    </div>
  </div>

  <script src="/vendor/d3/d3.min.js"></script>
  <script src="/vendor/quill/quill.js"></script>
  <script src="/vendor/glightbox/js/glightbox.min.js"></script>
  <script src="/vendor/html2canvas/html2canvas.min.js"></script>
  <script src="common.js"></script>
  <script src="main.js"></script>

</body>
</html>
