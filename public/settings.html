<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>设置 - 旅行地图</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="settings-page">
  <header class="topbar">
    <div>
      <h1>设置</h1>
      <p>调整卡片显示和清理媒体缓存</p>
    </div>
    <button id="backBtn" class="secondary">返回首页</button>
  </header>

  <main class="settings-main">
    <form id="settingsForm" class="settings-card">
      <h2>卡片显示</h2>
      <div class="settings-grid">
        <label>卡片最大宽度（px）<input name="card_max_width" type="number" min="120" max="800" required></label>
        <label>卡片标题字体（px）<input name="card_title_font_size" type="number" min="10" max="40" required></label>
        <label>卡片小字体（px）<input name="card_meta_font_size" type="number" min="10" max="32" required></label>
      </div>
      <div class="settings-actions">
        <button class="primary" type="submit">保存设置</button>
        <span id="saveStatus" class="status-text"></span>
      </div>
    </form>

    <section class="settings-card">
      <h2>清理缓存</h2>
      <p class="settings-note">清理会把不再需要的图片移动到 media_recycle 时间戳目录，不会直接删除。</p>
      <button id="cleanupBtn" class="danger" type="button">清理缓存图片</button>
      <pre id="cleanupResult" class="cleanup-result hidden"></pre>
    </section>
  </main>

  <script src="settings.js"></script>
</body>
</html>
