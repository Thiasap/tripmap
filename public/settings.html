<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>设置 - 旅行地图</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="settings-page">
  <header class="topbar">
    <div>
      <h1>设置</h1>
    </div>
    <div class="topbar-actions"><button id="logoutBtn" class="secondary">退出登录</button><button id="backBtn" class="secondary">返回首页</button></div>
  </header>

  <main class="settings-main">
    <form id="settingsForm" class="settings-card">
      <h2>卡片显示</h2>
      <div class="settings-grid">
        <label>卡片最大宽度（px）<input name="card_max_width" type="number" min="0" max="800" required></label>
        <label>卡片标题字体（px）<input name="card_title_font_size" type="number" min="0" max="40" required></label>
        <label>卡片小字体（px）<input name="card_meta_font_size" type="number" min="0" max="32" required></label>
        <label>地图拉伸（0.5-2）<input name="map_stretch" type="number" step="0.01" min="0.5" max="2" required></label>
        <label>图钉大小（px）<input name="pin_size" type="number" min="2" max="30" required></label>
        <label>默认缩放（0.3-5）<input name="default_zoom" type="number" step="0.1" min="0.3" max="5" required></label>
      </div>
      <div class="settings-actions">
        <button class="primary" type="submit">保存设置</button>
        <span id="saveStatus" class="status-text"></span>
      </div>
    </form>

    <section class="settings-card">
      <h2>清理缓存</h2>
      <p class="settings-note">清理会把不再需要的图片移动到 media_recycle 时间戳目录，不会直接删除。</p>
      <button id="cleanupBtn" class="danger" type="button">清理缓存图片</button>
      <pre id="cleanupResult" class="cleanup-result hidden"></pre>
    </section>

    <section class="settings-card">
      <h2>人员管理</h2>
      <div class="participant-toolbar">
        <div class="participant-search">
          <input type="text" id="participantSearch" placeholder="搜索姓名...">
          <button id="searchBtn" class="secondary">搜索</button>
        </div>
        <div class="participant-controls">
          <label>每页显示
            <select id="pageSizeSelect">
              <option value="5">5</option>
              <option value="10" selected>10</option>
              <option value="15">15</option>
            </select>
          </label>
        </div>
      </div>
      <table class="participant-table">
        <thead>
          <tr>
            <th>姓名</th>
            <th class="col-date">最近参加时间</th>
            <th class="col-count">参与次数</th>
            <th class="col-actions">操作</th>
          </tr>
        </thead>
        <tbody id="participantTableBody"></tbody>
      </table>
      <div class="pagination" id="participantPagination"></div>
      <div class="participant-add-form" id="participantAddForm">
        <button id="toggleAddBtn" class="add-toggle-btn" type="button">+</button>
        <span class="add-fields hidden" id="addFields">
          <input type="text" id="newParticipantName" placeholder="姓名（必填）" required>
          <input type="datetime-local" id="newParticipantDate">
          <input type="number" id="newParticipantCount" placeholder="参与次数" min="0" value="0">
          <button id="addParticipantBtn" class="primary">立即添加</button>
        </span>
      </div>
    </section>
  </main>

  <script src="settings.js"></script>
</body>
</html>
